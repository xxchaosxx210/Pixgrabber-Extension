<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>PixGrabber Thumbnail Picker</title>
        <style>
            body {
                margin: 0;
                padding: 8px 8px 64px;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                background: #ffffff;
            }

            .pixgrabber_holder {
                border-radius: 16px;
                padding: 10px;
                position: relative;
                margin: 10px;
            }

            .pixgrabber_overlay {
                position: absolute;
                inset: 0;
                border-radius: 6px;
                background-color: rgba(22, 83, 163, 0.35);
                display: none;
                pointer-events: none;
            }

            .pixgrabber_holder:hover {
                opacity: 0.85;
                cursor: pointer;
            }

            .pixgrabber_holder img {
                max-height: 180px;
                width: auto;
                margin: 3px;
            }

            .pixgrabber_submit {
                position: fixed;
                bottom: 12px;
                right: 12px;
                min-width: 96px;
                min-height: 40px;
                border-radius: 6px;
                border: 1px solid #1e6fe8;
                background: #1e6fe8;
                color: #ffffff;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }

            .pixgrabber_empty {
                margin: 20px;
            }
        </style>
    </head>
    <body>
        <script src="frame.js"></script>
    </body>
</html>
